<article class="card project-card">
  <h3>{{ project().title }}</h3>
  <p>{{ project().description }}</p>

  <ul class="tag-list" aria-label="Technologies used">
    @for (tech of project().tech; track tech) {
      <li class="tag">{{ tech }}</li>
    }
  </ul>

  @if (project().repoUrl || project().liveUrl) {
    <div class="links">
      @if (project().repoUrl; as repoUrl) {
        <a [href]="repoUrl" target="_blank" rel="noopener">Code</a>
      }
      @if (project().liveUrl; as liveUrl) {
        <a [href]="liveUrl" target="_blank" rel="noopener">Live site</a>
      }
    </div>
  }
</article>
